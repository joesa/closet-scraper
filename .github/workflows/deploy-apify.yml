name: Test and deploy Apify Actor

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apify-production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test scraper
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build scraper
        run: npm run build

  deploy:
    name: Deploy scraper to Apify
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify deployment credentials
        env:
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error::APIFY_TOKEN is not configured in this repository's Actions secrets."
            exit 1
          fi
          if [ -z "$APIFY_ACTOR_ID" ]; then
            echo "::error::APIFY_ACTOR_ID is not configured in this repository's Actions variables."
            exit 1
          fi

      - name: Read current production build
        id: before
        env:
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/acts/$APIFY_ACTOR_ID")
          previous_build_id=$(jq -r '.data.taggedBuilds.latest.buildId // empty' <<< "$response")
          if [ -z "$previous_build_id" ]; then
            echo "::error::The production Actor has no current latest build."
            exit 1
          fi
          echo "build-id=$previous_build_id" >> "$GITHUB_OUTPUT"

      - name: Set up Apify CLI
        uses: apify/setup-apify-cli-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}

      - name: Deploy and build Actor
        env:
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
        run: |
          apify push \
            --json \
            --wait-for-finish=999999 \
            --build-tag=latest \
            "$APIFY_ACTOR_ID" > "$RUNNER_TEMP/apify-build.json"

      - name: Verify production Actor build
        env:
          APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PREVIOUS_BUILD_ID: ${{ steps.before.outputs.build-id }}
        run: |
          actor_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/acts/$APIFY_ACTOR_ID")
          build_id=$(jq -r '.data.taggedBuilds.latest.buildId // empty' <<< "$actor_response")
          build_number=$(jq -r '.data.taggedBuilds.latest.buildNumber // empty' <<< "$actor_response")
          if [ -z "$build_id" ] || [ "$build_id" = "$PREVIOUS_BUILD_ID" ]; then
            echo "::error::Apify did not promote a new build to the latest tag."
            exit 1
          fi

          build_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/actor-builds/$build_id")
          build_status=$(jq -r '.data.status // empty' <<< "$build_response")
          if [ "$build_status" != "SUCCEEDED" ]; then
            echo "::error::Apify build $build_id finished with status $build_status."
            exit 1
          fi

          {
            echo "## Apify production deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Build ID: \`$build_id\`"
            echo "- Build number: \`$build_number\`"
            echo "- Build tag: \`latest\`"
            echo "- Status: \`$build_status\`"
          } >> "$GITHUB_STEP_SUMMARY"
